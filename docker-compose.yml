services:
  postgres:
    image: postgres:18-alpine
    container_name: ticketpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketpass}
      POSTGRES_USER: ${POSTGRES_USER:-ticketpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketpass_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - ticketpass_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketpass -d ticketpass"]
      interval: 5s
      timeout: 5s
      retries: 10


  mailpit:
   image: axllent/mailpit:latest
   container_name: ticketpass-mailpit
   restart: unless-stopped
   ports:
     - "1025:1025"
     - "8025:8025"

volumes:
  ticketpass_pgdata: