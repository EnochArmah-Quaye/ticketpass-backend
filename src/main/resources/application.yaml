spring:
  application:
    name: ticketpass-api
  config:
    import: optional:file:./.env[.properties] # lets local runs read .env; harmless if absent
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false       # no lazy loading in controllers; forces explicit fetching
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it matches
      properties:
        hibernate:
          jdbc.time_zone: UTC
          jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true    # spec 7: reject unknown fields
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  base-url: ${APP_BASE_URL}
  frontend-url: ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 30d
  ticket:
    hmac-secret: ${TICKET_HMAC_SECRET}
  order:
    hold-duration: 10m
    max-ticket-per-order: 10

